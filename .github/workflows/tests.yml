name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Touch tasks need embodied-ui; driving tests (myosuite-carla) are skipped.
          python -m pip install "embodied-ui @ git+https://github.com/M-Colley/embodied-ui"
          python -m pip install -e ".[test,lint,experience]"
      - name: Test
        run: python -m pytest tests -q
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Types
        run: python -m mypy src/embodied_human --ignore-missing-imports
      - name: Build
        run: python -m build
